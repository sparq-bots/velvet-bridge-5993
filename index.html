<!doctype html>
<html lang="und">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#1f3f8f">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://audio.dbs.org https://arc.dbs.org; media-src 'self' https://audio.dbs.org; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Reader</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="bar">
  <select id="trSel" aria-label="Translation" hidden></select>
  <div class="tools">
    <div class="lang">
      <button id="langBtn" class="btn icon" type="button" aria-haspopup="listbox" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7"/><path d="M9 3v2c0 4.418-2.239 8-5 8"/><path d="M5 9c0 2.144 2.952 3.908 6.7 4"/><path d="M12 20l4-9 4 9"/><path d="M19.1 18h-6.2"/></svg></button>
      <div id="langPanel" class="panel" hidden>
        <input id="langSearch" type="search" autocomplete="off" spellcheck="false" aria-label="Language">
        <ul id="langList" role="listbox"></ul>
      </div>
    </div>
    <a id="listen" class="btn" hidden target="_blank" rel="noreferrer noopener" aria-label="Listen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1"/><rect x="17" y="14" width="4" height="6" rx="1"/></svg>
    </a>
  </div>
</header>

<main id="text" tabindex="-1"><p class="muted">…</p></main>

<div class="bottom">
  <div id="player" class="player" hidden><audio id="aud" controls preload="none"></audio></div>
  <nav class="nav dock" aria-label="Book and chapter">
    <button id="prev" type="button" aria-label="Previous">‹</button>
    <select id="bookSel" aria-label="Book"></select>
    <select id="chSel" aria-label="Chapter"></select>
    <button id="next" type="button" aria-label="Next">›</button>
  </nav>
</div>

<div id="licPop" class="pop" hidden>
  <div class="pop-box" role="dialog" aria-modal="true" aria-label="License">
    <button type="button" class="lic-close" aria-label="Close">✕</button>
    <div id="licBody"></div>
  </div>
</div>
</body>
</html>
